plugins {
    alias(libs.plugins.android.application)
    // Firebase enabled
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.mytraveldiary'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.mytraveldiary"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Room schema export
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        resources {
            excludes += [
                    "/META-INF/INDEX.LIST",
                    "/META-INF/DEPENDENCIES",
                    "/META-INF/LICENSE",
                    "/META-INF/LICENSE.txt",
                    "/META-INF/NOTICE",
                    "/META-INF/NOTICE.txt",
                    "/META-INF/AL2.0",
                    "/META-INF/LGPL2.1"
            ]
        }
    }
}

dependencies {
    // ==================== CORE ANDROID DEPENDENCIES ====================
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // AndroidX Core Libraries (Updated to latest)
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Material Design (Latest)
    implementation 'com.google.android.material:material:1.12.0'

    // ==================== ARCHITECTURE COMPONENTS ====================
    // Lifecycle Components
    def lifecycle_version = "2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"

    // ==================== ROOM DATABASE (Storage) ====================
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    // ==================== NETWORKING ====================
    // Retrofit for RESTful API calls
    def retrofit_version = "2.11.0"
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-gson:$retrofit_version"

    // OkHttp for HTTP client
    def okhttp_version = "4.12.0"
    implementation "com.squareup.okhttp3:okhttp:$okhttp_version"
    implementation "com.squareup.okhttp3:logging-interceptor:$okhttp_version"

    // Gson for JSON parsing
    implementation 'com.google.code.gson:gson:2.11.0'

    // Volley (Alternative networking library)
    implementation 'com.android.volley:volley:1.2.1'

    // ==================== GEMINI AI ====================
    // Google Generative AI SDK
    implementation 'com.google.ai.client.generativeai:generativeai:0.1.2'
    // Guava for Gemini SDK
    implementation 'com.google.guava:guava:31.1-android'
    implementation "com.google.genai:google-genai:1.0.0"

    // ==================== MULTI-THREADING & COROUTINES ====================
    // Kotlin Coroutines (Optional - for Kotlin projects)
    // Note: These are Java-compatible but optional for pure Java projects
    // def coroutines_version = "1.9.0"
    // implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"
    // implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"

    // WorkManager for background tasks
    def work_version = "2.9.1"
    implementation "androidx.work:work-runtime:$work_version"

    // ==================== LOCATION SERVICES ====================
    // Google Play Services - Maps
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // OSMDroid for OpenStreetMap
    implementation 'org.osmdroid:osmdroid-android:6.1.20'

    // Mapbox (Optional alternative - Requires Mapbox repository in settings.gradle)
    // Uncomment and add Mapbox repository if needed
    // implementation 'com.mapbox.maps:android:11.7.1'

    // ==================== IMAGE LOADING ====================
    // Glide for image loading and caching
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // Picasso (Alternative)
    implementation 'com.squareup.picasso:picasso:2.8'

    // Circle ImageView
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    // ==================== CHARTS & VISUALIZATION ====================
    // MPAndroidChart for charts
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // ==================== FIREBASE (Advanced Features) ====================
    // Firebase BoM (Bill of Materials) for version management
    implementation platform('com.google.firebase:firebase-bom:33.6.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-messaging'

    // ==================== SENSORS & ADVANCED FEATURES ====================
    // CameraX for camera functionality
    def camerax_version = "1.4.0"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    // ==================== ML KIT - WORKING FEATURES ====================
    // Vision APIs (All Available)
    implementation 'com.google.mlkit:face-detection:16.1.7'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:image-labeling:17.0.8'          // Auto-detect objects in images
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'        // Scan QR codes, barcodes

    // Natural Language APIs (Available)
    implementation 'com.google.mlkit:translate:17.0.2'
    implementation 'com.google.mlkit:language-id:17.0.5'             // Detect language of text

    // Note: Smart Reply and Entity Extraction require Google Play Services
    // Not available in ML Kit standalone - removed to prevent build errors

    // ==================== UTILITIES ====================
    // Lottie for animations
    implementation 'com.airbnb.android:lottie:6.5.2'

    // EventBus for component communication
    implementation 'org.greenrobot:eventbus:3.3.1'

    // Leak Canary for memory leak detection (Debug only)
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'

    // Timber for logging
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // Preferences DataStore (Modern SharedPreferences alternative)
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
}
